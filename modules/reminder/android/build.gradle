plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'com.aiyuexi.aischedule.reminder'
version = '1.0.0'
android {
  namespace "com.aiyuexi.aischedule.reminder"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lint {
    // 与 overlay / speech 两个模块同一口径：自用模块，lint 不该挡住打包
    abortOnError = false
  }
}
